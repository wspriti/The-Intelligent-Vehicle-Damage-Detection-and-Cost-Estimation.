<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile</title>

<style>
body {
    font-family: Poppins;
    background: linear-gradient(135deg, #6a9dfc, #c86dd7);
}

.card {
    width: 800px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

.row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 12px;
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 10px;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="card">

<h2 style="text-align:center;">User Profile</h2>

<div class="row">
<p><b>Name:</b> {{ user_info.name }}</p>
<p><b>Vehicle ID:</b> {{ user_info.vehicle_id }}</p>
</div>

<div class="row">
<p><b>Email:</b> {{ user_info.email }}</p>
<p><b>Brand:</b> {{ user_info.car_brand }}</p>
</div>

<div class="row">
<p><b>Phone:</b> {{ user_info.contact_number }}</p>
<p><b>Model:</b> {{ user_info.model }}</p>
</div>

<p><b>Address:</b> {{ user_info.address }}</p>

<!-- <a href="/edit-profile"><button>Edit Profile</button></a> -->
<a href="/dashboard"><button>Go to Dashboard</button></a>
<a href="/logout"><button style="background:red;">Logout</button></a>

</div>

</body>
</html>
