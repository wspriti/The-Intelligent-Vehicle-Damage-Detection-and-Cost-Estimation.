<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Damage Detection</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #6a9dfc, #c86dd7);
    color: #333;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    background: white;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.subtext {
    color: #666;
    margin-bottom: 30px;
}

.features {
    display: flex;
    justify-content: space-around;
    margin-bottom: 30px;
}

.feature {
    text-align: center;
}

.feature h3 {
    margin: 10px 0 5px;
}

.upload-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.upload-box {
    border: 2px dashed #4a90e2;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
}

.upload-box input {
    width: 100%;
}

.upload-box img {
    margin-top: 10px;
    width: 100%;
    border-radius: 10px;
}

button {
    background: #2ecc71;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
}

button:hover {
    background: #27ae60;
}

.error {
    color: red;
    margin-bottom: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <a href="/profile">👤 Profile</a>
        <a href="/logout">🚪 Logout</a>
    </div>
    <h1>Smart Damage Detection Dashboard</h1>
    <p class="subtext">
        Upload vehicle images for AI-powered damage detection and cost estimation
    </p>

    <!-- FEATURES -->
    <div class="features">
        <div class="feature">
            <h3>⚡ Fast</h3>
            <p>Instant results</p>
        </div>
        <div class="feature">
            <h3>🎯 Accurate</h3>
            <p>YOLOv8 AI</p>
        </div>
        <div class="feature">
            <h3>💰 Smart Cost</h3>
            <p>Dynamic pricing</p>
        </div>
    </div>

    <!-- ERROR MESSAGE -->
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <!-- FORM -->
    <form action="/predict" method="POST" enctype="multipart/form-data">

        <div class="upload-grid">

            <div class="upload-box">
                <label>Front View</label>
                <input type="file" name="front" onchange="preview(event,'p1')">
                <img id="p1">
            </div>

            <div class="upload-box">
                <label>Rear View</label>
                <input type="file" name="rear" onchange="preview(event,'p2')">
                <img id="p2">
            </div>

            <div class="upload-box">
                <label>Left View</label>
                <input type="file" name="left" onchange="preview(event,'p3')">
                <img id="p3">
            </div>

            <div class="upload-box">
                <label>Right View</label>
                <input type="file" name="right" onchange="preview(event,'p4')">
                <img id="p4">
            </div>

        </div>

        <button type="submit">Estimate Repair Price</button>

    </form>

</div>

<script>
function preview(event, id) {
    document.getElementById(id).src = URL.createObjectURL(event.target.files[0]);
}
</script>

</body>
</html>
