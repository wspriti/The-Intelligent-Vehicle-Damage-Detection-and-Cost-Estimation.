<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #6a9dfc, #c86dd7);
}

.card {
    width: 800px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100%;
}

button {
    width: 100%;
    padding: 12px;
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 10px;
    margin-top: 15px;
}

.error {
    color: red;
}
</style>
</head>

<body>

<div class="card">
<h2 style="text-align:center;">Sign Up</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">
<div class="grid">

<input name="name" placeholder="Full Name" required>
<input name="address" placeholder="Full Address" required>

<input name="email" placeholder="Email" required>
<input name="vehicle_id" placeholder="Vehicle ID" required>

<input type="password" name="password" placeholder="Password" required>
<input name="car_brand" placeholder="Car Brand" required>

<input name="phone" placeholder="Phone Number" required>
<input name="model" placeholder="Car Model" required>

</div>

<button>Sign Up</button>
</form>

<p style="text-align:center;">Already have an account? <a href="/login">Login</a></p>

</div>

</body>
</html>
